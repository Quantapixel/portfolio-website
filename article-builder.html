<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article Builder</title>
  <!-- Use the real site stylesheet so the preview is pixel-identical -->
  <link rel="stylesheet" href="css/main.css" />
  <style>
    /* ── TOOL LAYOUT ── */
    /* Reset things main.css sets globally that break the split-pane layout */
    body { overflow: hidden !important; }
    #app  { padding-top: 0 !important; }
    header { display: none !important; }
    .page, .page.active { display: contents; } /* don't let page rules hide our divs */

    .builder {
      display: grid;
      grid-template-columns: 420px 1fr;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      overflow: hidden;
    }

    /* ── TOOLBAR ── */
    .b-toolbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .7rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
    }
    .b-toolbar-title {
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--t4);
    }
    .b-toolbar-title span { color: var(--gold); }
    .b-toolbar-right { display: flex; align-items: center; gap: .6rem; }

    /* ── BUTTONS ── */
    .b-btn {
      background: none;
      border: 1px solid var(--border2);
      color: var(--t3);
      padding: .35rem .9rem;
      font-size: 11px;
      font-family: var(--mono);
      letter-spacing: .06em;
      border-radius: 3px;
      cursor: pointer;
      transition: all .15s;
    }
    .b-btn:hover { border-color: var(--gold); color: var(--gold); }
    .b-btn-primary {
      background: var(--gold2);
      border-color: var(--gold);
      color: var(--gold);
    }
    .b-btn-primary:hover { background: rgba(212,175,106,.18); }

    /* ── EDITOR PANEL ── */
    .b-editor {
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .b-panel-hdr {
      padding: .7rem 1.2rem;
      border-bottom: 1px solid var(--border);
      font-size: 9px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--t4);
      background: var(--bg2);
      flex-shrink: 0;
    }
    .b-fields {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: .9rem;
    }
    .b-field { display: flex; flex-direction: column; gap: .3rem; }
    .b-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
    .b-label {
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--t4);
      font-family: var(--mono);
    }
    .b-input {
      background: var(--bg2);
      border: 1px solid var(--border2);
      color: var(--t1);
      font-family: var(--mono);
      font-size: 12px;
      padding: .45rem .7rem;
      border-radius: 3px;
      outline: none;
      transition: border-color .15s;
      width: 100%;
    }
    .b-input:focus { border-color: var(--gold); }
    .b-input::placeholder { color: var(--t4); }
    .b-textarea {
      background: var(--bg2);
      border: 1px solid var(--border2);
      color: var(--t2);
      font-family: var(--mono);
      font-size: 11.5px;
      padding: .6rem .8rem;
      border-radius: 0 0 3px 3px;
      outline: none;
      transition: border-color .15s;
      width: 100%;
      resize: none;
      min-height: 260px;
      line-height: 1.7;
      tab-size: 2;
    }
    .b-textarea:focus { border-color: var(--gold); }
    .b-hint { font-size: 10px; color: var(--t4); line-height: 1.5; font-family: var(--mono); }

    /* ── CONTENT MINI-TOOLBAR ── */
    .b-ctb {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      padding: .5rem .8rem;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-bottom: none;
      border-radius: 3px 3px 0 0;
    }
    .b-ctb-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--t4);
      font-size: 10px;
      font-family: var(--mono);
      padding: 2px 8px;
      border-radius: 2px;
      cursor: pointer;
      transition: all .12s;
    }
    .b-ctb-btn:hover { border-color: var(--gold); color: var(--gold); }
    .b-ctb-sep { width: 1px; background: var(--border); margin: 2px 3px; align-self: stretch; }

    /* ── PREVIEW PANEL ── */
    .b-preview {
      overflow-y: auto;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    .b-preview-wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 3rem 2rem 5rem;
      width: 100%;
    }

    /* ── EMPTY STATE ── */
    .b-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      gap: .5rem;
      color: var(--t4);
      font-size: 11px;
      letter-spacing: .04em;
      font-family: var(--mono);
    }
    .b-empty-icon { font-size: 1.6rem; opacity: .3; }

    /* ── BLOB SECTION ── */
    .b-blob {
      grid-column: 1 / -1;
      border-top: 1px solid var(--border);
      background: var(--bg2);
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s ease;
    }
    .b-blob.open { max-height: 300px; }
    .b-blob-inner {
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: .6rem;
    }
    .b-blob-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .b-blob-label {
      font-size: 9px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--t4);
      font-family: var(--mono);
    }
    .b-blob-actions { display: flex; gap: .5rem; }
    .b-blob-out {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: .7rem 1rem;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--t3);
      line-height: 1.6;
      overflow: auto;
      max-height: 180px;
      white-space: pre;
      cursor: text;
      user-select: all;
    }

    /* ── TOAST ── */
    .b-toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 3px;
      padding: .45rem 1rem;
      font-size: 11px;
      color: var(--t2);
      font-family: var(--mono);
      opacity: 0;
      transition: all .2s;
      z-index: 9999;
      pointer-events: none;
      white-space: nowrap;
    }
    .b-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--t4); }
  </style>
</head>
<body>

<div class="builder">

  <!-- TOOLBAR -->
  <div class="b-toolbar">
    <span class="b-toolbar-title">// <span>article builder</span></span>
    <div class="b-toolbar-right">
      <button class="b-btn" id="btn-clear">clear</button>
      <button class="b-btn" id="btn-blob">generate blob</button>
      <button class="b-btn b-btn-primary" id="btn-copy">copy blob</button>
    </div>
  </div>

  <!-- EDITOR -->
  <div class="b-editor">
    <div class="b-panel-hdr">fields</div>
    <div class="b-fields">

      <div class="b-field">
        <label class="b-label" for="f-id">id <span style="font-size:9px;color:var(--t4)">(slug, no spaces)</span></label>
        <input class="b-input" id="f-id" type="text" placeholder="my-cool-project" autocomplete="off" spellcheck="false" />
      </div>

      <div class="b-field-row">
        <div class="b-field">
          <label class="b-label" for="f-name">name</label>
          <input class="b-input" id="f-name" type="text" placeholder="My Cool Project" />
        </div>
        <div class="b-field">
          <label class="b-label" for="f-category">category</label>
          <input class="b-input" id="f-category" type="text" placeholder="web-hacking" />
        </div>
      </div>

      <div class="b-field">
        <label class="b-label" for="f-desc">desc <span style="font-size:9px;color:var(--t4)">(shown on card)</span></label>
        <input class="b-input" id="f-desc" type="text" placeholder="Short one-line description" />
      </div>

      <div class="b-field-row">
        <div class="b-field">
          <label class="b-label" for="f-date">date <span style="font-size:9px;color:var(--t4)">(YYYY-MM)</span></label>
          <input class="b-input" id="f-date" type="text" placeholder="2026-07" />
        </div>
        <div class="b-field">
          <label class="b-label" for="f-tags">tags <span style="font-size:9px;color:var(--t4)">(comma separated)</span></label>
          <input class="b-input" id="f-tags" type="text" placeholder="javascript, security" />
        </div>
      </div>

      <div class="b-field">
        <label class="b-label" for="f-lede">lede <span style="font-size:9px;color:var(--t4)">(italic subtitle)</span></label>
        <input class="b-input" id="f-lede" type="text" placeholder="A one-sentence hook for the article" />
      </div>

      <div class="b-field">
        <label class="b-label">content <span style="font-size:9px;color:var(--t4)">(HTML)</span></label>
        <div class="b-ctb" id="content-toolbar">
          <button class="b-ctb-btn" data-wrap="<p>|</p>">p</button>
          <button class="b-ctb-btn" data-wrap="<h2>|</h2>">h2</button>
          <button class="b-ctb-btn" data-wrap="<h3>|</h3>">h3</button>
          <div class="b-ctb-sep"></div>
          <button class="b-ctb-btn" data-wrap="<strong>|</strong>"><b>b</b></button>
          <button class="b-ctb-btn" data-wrap="<em>|</em>"><i>i</i></button>
          <button class="b-ctb-btn" data-wrap='<a href="|">link</a>'>a</button>
          <button class="b-ctb-btn" data-wrap="<code>|</code>">`c`</button>
          <div class="b-ctb-sep"></div>
          <button class="b-ctb-btn" data-snippet="<pre><code>|</code></pre>">pre</button>
          <button class="b-ctb-btn" data-snippet="<blockquote>|</blockquote>">bq</button>
          <button class="b-ctb-btn" data-snippet="<ul>\n  <li>|</li>\n</ul>">ul</button>
          <button class="b-ctb-btn" data-snippet="<ol>\n  <li>|</li>\n</ol>">ol</button>
          <div class="b-ctb-sep"></div>
          <button class="b-ctb-btn" data-snippet="<hr>">hr</button>
          <button class="b-ctb-btn" data-snippet='<img src="|" alt="">'>img</button>
        </div>
        <textarea class="b-textarea" id="f-content" placeholder="<p>Start writing...</p>&#10;&#10;<h2>A Section</h2>&#10;<p>More content here.</p>"></textarea>
      </div>

      <p class="b-hint">Preview updates live. Hit <strong style="color:var(--t2)">copy blob</strong> when done and paste into the PROJECTS array in app.js.</p>

    </div>
  </div>

  <!-- PREVIEW -->
  <div class="b-preview">
    <div class="b-panel-hdr">live preview</div>
    <div class="b-preview-wrap">

      <div class="b-empty" id="b-empty">
        <div class="b-empty-icon">◈</div>
        <div>start filling in fields to see a preview</div>
      </div>

      <div id="b-preview-content" style="display:none">
        <div class="art-header">
          <span class="art-back">← back to projects</span>
          <div class="art-meta">
            <span class="art-cat" id="pv-cat"></span>
            <span id="pv-date"></span>
          </div>
          <h1 class="art-title" id="pv-title"></h1>
          <p class="art-lede" id="pv-lede"></p>
          <div class="art-tags" id="pv-tags"></div>
        </div>
        <div class="art-body" id="pv-body"></div>
      </div>

    </div>
  </div>

  <!-- BLOB OUTPUT -->
  <div class="b-blob" id="b-blob">
    <div class="b-blob-inner">
      <div class="b-blob-hdr">
        <span class="b-blob-label">generated blob — paste into PROJECTS array in app.js</span>
        <div class="b-blob-actions">
          <button class="b-btn" id="btn-blob-close">close</button>
          <button class="b-btn b-btn-primary" id="btn-blob-copy">copy</button>
        </div>
      </div>
      <div class="b-blob-out" id="blob-out"></div>
    </div>
  </div>

</div>

<div class="b-toast" id="b-toast"></div>

<script>
  const fId       = document.getElementById('f-id');
  const fName     = document.getElementById('f-name');
  const fCategory = document.getElementById('f-category');
  const fDesc     = document.getElementById('f-desc');
  const fDate     = document.getElementById('f-date');
  const fTags     = document.getElementById('f-tags');
  const fLede     = document.getElementById('f-lede');
  const fContent  = document.getElementById('f-content');

  const pvCat          = document.getElementById('pv-cat');
  const pvDate         = document.getElementById('pv-date');
  const pvTitle        = document.getElementById('pv-title');
  const pvLede         = document.getElementById('pv-lede');
  const pvTags         = document.getElementById('pv-tags');
  const pvBody         = document.getElementById('pv-body');
  const bEmpty         = document.getElementById('b-empty');
  const bPreviewContent= document.getElementById('b-preview-content');
  const bBlob          = document.getElementById('b-blob');
  const blobOut        = document.getElementById('blob-out');
  const bToast         = document.getElementById('b-toast');

  // ── HELPERS ──

  function parseTags(raw) {
    return raw.split(',').map(t => t.trim()).filter(Boolean);
  }

  function hasAnyInput() {
    return fId.value || fName.value || fCategory.value ||
           fDesc.value || fDate.value || fTags.value ||
           fLede.value || fContent.value;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;')
              .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showToast(msg) {
    bToast.textContent = msg;
    bToast.classList.add('show');
    setTimeout(() => bToast.classList.remove('show'), 2000);
  }

  // ── LIVE PREVIEW ──

  function updatePreview() {
    if (!hasAnyInput()) {
      bEmpty.style.display = 'flex';
      bPreviewContent.style.display = 'none';
      return;
    }
    bEmpty.style.display = 'none';
    bPreviewContent.style.display = 'block';

    pvCat.textContent   = fCategory.value || '';
    pvDate.textContent  = fDate.value || '';
    pvTitle.textContent = fName.value || '';
    pvLede.textContent  = fLede.value || '';
    pvTags.innerHTML    = parseTags(fTags.value)
                           .map(t => `<span class="tag">${escHtml(t)}</span>`).join('');
    // Intentionally rendered as HTML — user is writing content for their own site
    pvBody.innerHTML    = fContent.value || '';
  }

  [fId, fName, fCategory, fDesc, fDate, fTags, fLede, fContent]
    .forEach(el => el.addEventListener('input', updatePreview));

  // ── BLOB GENERATION ──

  function buildBlob() {
    const tags        = parseTags(fTags.value);
    const tagsLiteral = '[' + tags.map(t => `"${t.replace(/"/g,'\\"')}"`).join(', ') + ']';
    const safeContent = fContent.value
      .replace(/\\/g, '\\\\')
      .replace(/`/g, '\\`')
      .replace(/\$\{/g, '\\${');

    return `{
  id: "${fId.value.trim()}",
  name: "${fName.value.trim()}",
  desc: "${fDesc.value.trim()}",
  date: "${fDate.value.trim()}",
  category: "${fCategory.value.trim()}",
  tags: ${tagsLiteral},
  lede: "${fLede.value.trim()}",
  content: \`
${safeContent}
  \`
}`;
  }

  // ── CONTENT MINI-TOOLBAR ──

  document.getElementById('content-toolbar').addEventListener('click', e => {
    const btn = e.target.closest('.b-ctb-btn');
    if (!btn) return;
    const wrap    = btn.dataset.wrap;
    const snippet = btn.dataset.snippet;
    const ta      = fContent;
    const start   = ta.selectionStart;
    const end     = ta.selectionEnd;
    const sel     = ta.value.slice(start, end);
    let insert, cursor;

    if (wrap) {
      const [before, after] = wrap.split('|');
      insert = before + (sel || '') + after;
      cursor = start + before.length + (sel ? sel.length : 0);
    } else if (snippet) {
      insert = snippet.replace('|', sel || '');
      const pipeIdx = snippet.indexOf('|');
      cursor = pipeIdx >= 0 ? start + pipeIdx : start + insert.length;
    } else return;

    ta.value = ta.value.slice(0, start) + insert + ta.value.slice(end);
    ta.focus();
    ta.setSelectionRange(cursor, cursor);
    updatePreview();
  });

  // ── BUTTONS ──

  document.getElementById('btn-blob').addEventListener('click', () => {
    blobOut.textContent = buildBlob();
    bBlob.classList.add('open');
  });

  function copyBlob() {
    const text = blobOut.textContent;
    if (!text) { showToast('generate blob first'); return; }
    navigator.clipboard.writeText(text)
      .then(() => showToast('blob copied ✓'))
      .catch(() => {
        const range = document.createRange();
        range.selectNodeContents(blobOut);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        document.execCommand('copy');
        sel.removeAllRanges();
        showToast('blob copied ✓');
      });
  }

  document.getElementById('btn-copy').addEventListener('click', () => {
    blobOut.textContent = buildBlob();
    bBlob.classList.add('open');
    copyBlob();
  });

  document.getElementById('btn-blob-copy').addEventListener('click', copyBlob);
  document.getElementById('btn-blob-close').addEventListener('click', () => bBlob.classList.remove('open'));

  document.getElementById('btn-clear').addEventListener('click', () => {
    if (!hasAnyInput()) return;
    if (!confirm('Clear all fields?')) return;
    [fId, fName, fCategory, fDesc, fDate, fTags, fLede, fContent].forEach(el => el.value = '');
    bBlob.classList.remove('open');
    updatePreview();
  });

  // Auto-slug id from name
  fName.addEventListener('input', () => {
    if (!fId.value) {
      fId.value = fName.value.toLowerCase().trim()
        .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }
  });

  // Pre-fill date
  const now = new Date();
  fDate.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
</script>

</body>
</html>
