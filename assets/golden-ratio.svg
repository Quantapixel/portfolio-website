<svg xmlns="http://www.w3.org/2000/svg" viewBox="130 -242 1650 1040" fill="none">
  <!--
    True golden logarithmic spiral: phi = (1 + sqrt(5)) / 2.
    P(t) = C + r0 * exp(-2 * ln(phi) * t / pi) *
           (cos(theta0 + t), sin(theta0 + t)).
    Radius decreases by exactly phi per quarter-turn.
    C = (1312, 500); r0 = 1189.5937102725907; theta0 = 2.90976884908939.
    Cubic Hermite samples use analytic derivatives, steps <= pi/24.
    The 1600 by 1600/phi rectangle is recursively divided into squares,
    rotating left/top/right/bottom; its limiting point is also C.
    The logarithmic curve passes through successive square corners;
    it is not the approximate spiral made from circular quarter-arcs.
  -->
